[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aura"
version = "0.2.0"
description = "Suomalaisen avoimen datan discovery- ja ymmärryspalvelu"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Aura Contributors" },
]
keywords = ["open-data", "finland", "mcp", "avoindata", "ckan", "dcat"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

dependencies = [
    "fastmcp>=3.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.110.0",
    "jinja2>=3.1.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[project.scripts]
aura = "aura.cli:main"

[project.urls]
Homepage = "https://github.com/trotor/aura"
Repository = "https://github.com/trotor/aura"
Issues = "https://github.com/trotor/aura/issues"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

# aura.tools.* imports mcp from aura.server, which imports aura.tools
# → circular import prevents mypy from resolving mcp's type.
# The @mcp.tool() decorator is well-typed by FastMCP at runtime.
[[tool.mypy.overrides]]
module = "aura.tools.*"
disallow_untyped_decorators = false
disable_error_code = ["has-type"]
