<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" width="960" height="470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Auran arkkitehtuuri</title>
  <desc id="d">Avoimen datan lähteet kerätään hakemistoon, jota tekoälyavustajat käyttävät MCP:n kautta ja ihmiset selaimella. query_source hakee rivit suoraan lähteestä.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#10302a"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9a6f0c"/>
    </marker>
  </defs>
  <rect width="960" height="470" fill="#f3f6f5"/>

  <!-- Lähteet -->
  <rect x="20" y="30" width="210" height="330" rx="6" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="38" y="60" font-size="17" font-weight="700" fill="#10302a">46 lähdettä</text>
  <g font-size="13.5" fill="#4b625c">
    <text x="38" y="90">Tilastokeskus (StatFin)</text>
    <text x="38" y="112">THL Sotkanet</text>
    <text x="38" y="134">avoindata.fi, HRI, SYKE</text>
    <text x="38" y="156">Luke, Metsäkeskus, GTK</text>
    <text x="38" y="178">Ilmatieteen laitos</text>
    <text x="38" y="200">Digitraffic, Traficom</text>
    <text x="38" y="222">MML, Väylävirasto</text>
    <text x="38" y="244">Eduskunta, Finlex</text>
    <text x="38" y="266">Vipunen, Kelasto, PRH</text>
    <text x="38" y="288">36 kunnan karttapalvelut</text>
    <text x="38" y="318" fill="#10302a">ja muut</text>
  </g>

  <!-- Keruu -->
  <line x1="232" y1="140" x2="270" y2="140" stroke="#10302a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="272" y="80" width="200" height="130" rx="6" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="290" y="110" font-size="17" font-weight="700" fill="#10302a">Keruu</text>
  <g font-size="13.5" fill="#4b625c">
    <text x="290" y="136">Harvesterit lähteittäin</text>
    <text x="290" y="158">CKAN, PxWeb, WFS,</text>
    <text x="290" y="178">OData, OpenAPI, GTFS</text>
    <text x="290" y="198">Vain metatiedot</text>
  </g>

  <!-- Hakemisto -->
  <line x1="474" y1="140" x2="512" y2="140" stroke="#10302a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="514" y="30" width="210" height="190" rx="6" fill="#10302a"/>
  <text x="532" y="60" font-size="17" font-weight="700" fill="#f3f6f5">Hakemisto</text>
  <g font-size="13.5" fill="#d6e0dc">
    <text x="532" y="88">13 000+ aineistoa</text>
    <text x="532" y="110">SQLite + FTS5, lemmat</text>
    <text x="532" y="132">ja yhdyssanojen osat</text>
    <text x="532" y="154">Aluetunnistus: kunnat,</text>
    <text x="532" y="174">maakunnat, postinumerot</text>
    <text x="532" y="196">Laatu ja saatavuus</text>
  </g>

  <!-- Pro-kerros -->
  <rect x="514" y="238" width="210" height="122" rx="6" fill="#ffffff" stroke="#9a6f0c" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="532" y="264" font-size="15" font-weight="700" fill="#9a6f0c">Aura Pro -kerros</text>
  <g font-size="13.5" fill="#4b625c">
    <text x="532" y="290">200+ valmista tunnuslukua</text>
    <text x="532" y="312">Haku taulujen ja sarakkeiden</text>
    <text x="532" y="332">sisällöstä</text>
    <text x="532" y="352">Monikielinen vektorihaku</text>
  </g>

  <!-- Käyttö -->
  <line x1="726" y1="95" x2="764" y2="95" stroke="#10302a" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="726" y1="190" x2="764" y2="230" stroke="#10302a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="766" y="40" width="174" height="110" rx="6" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="784" y="68" font-size="17" font-weight="700" fill="#10302a">MCP /mcp</text>
  <g font-size="13.5" fill="#4b625c">
    <text x="784" y="94">Tekoälyavustajat:</text>
    <text x="784" y="114">Claude, ChatGPT,</text>
    <text x="784" y="134">Cursor, omat agentit</text>
  </g>
  <rect x="766" y="190" width="174" height="96" rx="6" fill="#ffffff" stroke="#d6e0dc"/>
  <text x="784" y="218" font-size="17" font-weight="700" fill="#10302a">Web</text>
  <g font-size="13.5" fill="#4b625c">
    <text x="784" y="244">Ihmiset: haku,</text>
    <text x="784" y="264">kartta, esikatselu</text>
  </g>

  <!-- query_source: rivit suoraan lähteestä -->
  <path d="M940 120 H950 Q954 120 954 124 V396 Q954 400 950 400 H129 Q125 400 125 396 V364" fill="none" stroke="#9a6f0c" stroke-width="1.8" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="250" y="432" font-size="14" fill="#10302a"><tspan font-family="ui-monospace, Menlo, monospace" font-weight="700" fill="#9a6f0c">query_source</tspan> hakee rivit suoraan julkaisijan rajapinnasta, lähde ja lisenssi mukana</text>
</svg>
