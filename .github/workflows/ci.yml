name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      # lfs: data/aura.db on LFS-tiedosto. Ilman tätä CI saa osoitintiedoston
      # ja jokainen kantaa koskeva testi kaatuu viestiin "file is not a
      # database" — virhe joka ei kerro mitään syystä.
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v
      - run: ruff check src/ tests/
      - run: mypy src/
